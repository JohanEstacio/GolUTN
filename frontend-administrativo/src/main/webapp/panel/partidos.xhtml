<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/templates/layout.xhtml">

    <ui:param name="titulo" value="Gestion de partidos" />

    <ui:define name="contenido">
        <header class="encabezado-pagina">
            <div>
                <span class="sobretitulo">Competición</span>
                <h1>Gestión de partidos</h1>
                <p>Consulta el calendario y registra el resultado oficial de cada encuentro.</p>
            </div>
        </header>

        <h:form id="formPartidos" styleClass="contenedor-tabla">
            <p:dataTable id="tablaPartidos" var="p" value="#{partidosBean.partidos}"
                         emptyMessage="No hay partidos cargados todavía."
                         paginator="true" rows="10" reflow="true"
                         styleClass="tabla-administrativa tabla-partidos">

                <p:column headerText="Local">
                    <h:outputText value="#{p.seleccionLocal}" />
                </p:column>
                <p:column headerText="Visitante">
                    <h:outputText value="#{p.seleccionVisitante}" />
                </p:column>
                <p:column headerText="Sede">
                    <h:outputText value="#{p.sede}" />
                </p:column>
                <p:column headerText="Fase">
                    <h:outputText value="#{p.fase}" />
                </p:column>
                <p:column headerText="Fecha y hora">
                    <h:outputText value="#{p.fechaHora}">
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" type="localDateTime" />
                    </h:outputText>
                </p:column>
                <p:column headerText="Estado">
                    <span class="estado-tag estado-#{p.estadoCss}">
                        #{p.estado}
                    </span>
                </p:column>
                <p:column headerText="Marcador">
                    <h:outputText value="#{p.golesLocal} - #{p.golesVisitante}"
                                  rendered="#{p.golesLocal != null}" />
                    <h:outputText value="Sin jugar" rendered="#{p.golesLocal == null}" />
                </p:column>
                <p:column headerText="Acción">
                    <p:commandButton value="Registrar resultado"
                                     actionListener="#{partidosBean.prepararRegistroResultado(p)}"
                                     update=":formPartidos:dialogResultado" oncomplete="PF('dlgResultado').show()"
                                     styleClass="boton-compacto" />
                </p:column>
            </p:dataTable>

            <!-- Dialogo para registrar el resultado oficial (RF11, CP09, CP10) -->
            <p:dialog id="dialogResultado" header="Registrar resultado oficial" widgetVar="dlgResultado"
                      modal="true" width="380" responsive="true" styleClass="dialogo-resultado">
                <h:panelGrid columns="2" rendered="#{partidosBean.partidoSeleccionado != null}"
                             styleClass="formulario-dialogo">
                    <h:outputText value="Partido:" styleClass="etiqueta-campo" />
                    <h:outputText value="#{partidosBean.partidoSeleccionado.seleccionLocal} vs #{partidosBean.partidoSeleccionado.seleccionVisitante}"
                                  styleClass="partido-seleccionado" />

                    <h:outputText value="Goles local:" styleClass="etiqueta-campo" />
                    <p:inputNumber value="#{partidosBean.golesLocalIngresados}" decimalPlaces="0" minValue="0"
                                   inputStyleClass="campo-marcador" />

                    <h:outputText value="Goles visitante:" styleClass="etiqueta-campo" />
                    <p:inputNumber value="#{partidosBean.golesVisitanteIngresados}" decimalPlaces="0" minValue="0"
                                   inputStyleClass="campo-marcador" />
                </h:panelGrid>

                <div class="acciones-dialogo">
                    <p:commandButton value="Guardar resultado" action="#{partidosBean.guardarResultado}"
                                     update=":formPartidos" oncomplete="PF('dlgResultado').hide()"
                                     styleClass="boton-principal" />
                </div>
            </p:dialog>
        </h:form>
    </ui:define>
</ui:composition>
