<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/templates/layout.xhtml">

    <ui:param name="titulo" value="Gestion de usuarios" />

    <ui:define name="contenido">
        <h2>Gestion de usuarios</h2>
        <p>Administra las cuentas registradas y sus roles (administrador, usuario, invitado).</p>

        <h:form id="formUsuarios">
            <p:dataTable var="u" value="#{usuariosBean.usuarios}"
                         emptyMessage="No hay usuarios cargados todavia."
                         paginator="true" rows="10">

                <p:column headerText="Nombre">
                    <h:outputText value="#{u.nombre}" />
                </p:column>
                <p:column headerText="Correo">
                    <h:outputText value="#{u.correo}" />
                </p:column>
                <p:column headerText="Rol">
                    <p:selectOneMenu value="#{u.rol}">
                        <f:selectItems value="#{usuariosBean.rolesDisponibles}" />
                    </p:selectOneMenu>
                </p:column>
                <p:column headerText="Activo">
                    <p:selectBooleanCheckbox value="#{u.activo}" />
                </p:column>
                <p:column headerText="Accion">
                    <p:commandButton value="Guardar" action="#{usuariosBean.cambiarRol(u)}" update=":formUsuarios" />
                </p:column>
            </p:dataTable>
        </h:form>
    </ui:define>
</ui:composition>
